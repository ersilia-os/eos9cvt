Identifier: eos9cvt
Slug: permeability-efflux-mtl
Status: Ready
Title: Permeability and Efflux Prediction (GNN-MTL)
Description: 'Predicts four transport-related endpoints at once: apparent permeability
  across Caco-2 monolayers together with efflux ratios in Caco-2, MDCK and NIH-MDCK
  cells. Modelling them jointly through a multitask graph neural network lets the
  shared biology inform every endpoint rather than fitting each in isolation. Efflux
  ratios above log10(2) suggest active export is occurring, which is the practical
  signal that a compound may be a transporter substrate rather than simply impermeable.'
